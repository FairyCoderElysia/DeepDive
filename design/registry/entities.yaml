  # ---------- 5 个工艺旋钮（全项目共享；权威定义在 element-pool §Tuning Knobs A）----------

  - name: param_temperature
    value: { min: 20, max: 200, default: 80 }
    unit: "°C"
    note: "温度 T。范围来自 T0 实测（每个旋钮都已验过存在内部最优，非单调）。默认值【暂从 T0 继承】，正式值应在 T1 按手感重调。"
    referenced_by: [element-pool]

  - name: param_pressure
    value: { min: 1, max: 40, default: 6 }
    unit: "atm"
    note: "压强 P。⚠️ 注意与「深度带来的压强」区分：那属 C1（T3），本旋钮是反应器的一个工艺参数（MVP 即有）。"
    referenced_by: [element-pool]

  - name: param_residence_time
    value: { min: 0.5, max: 15, default: 4.0 }
    unit: "相对"
    note: "停留时间 τ。"
    referenced_by: [element-pool]

  - name: param_catalyst
    value: { options: [无催化剂, 镍网, 铂片], default: 铂片 }
    unit: "枚举 3"
    note: "催化剂。"
    referenced_by: [element-pool]

  - name: param_anode_material
    value: { options: [石墨阳极, 钌铱涂层钛_析氯型, 铱钽涂层钛_析氧型], default: 铱钽涂层钛_析氧型 }
    unit: "枚举 3"
    note: "阳极材料。**它存在的唯一理由是氯污染通道** —— 若砍掉 Cl 通道，本旋钮会变成死重、参数表必须退回 4 个。"
    referenced_by: [element-pool]
