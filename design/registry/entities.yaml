    tradeoff: "稳定性 vs 性能"
    referenced_by: [reaction-solver, process-graph]

  - name: CONTENTION_CONVENTION
    value: "层间抢（玩家可配优先级）；层内按需求比例等分"
    note: "多台机器争同一池料的语义约定。A3 定义、A5 使用（A5 的图求值语义来自 A3）。"
    requirement: "优先级必须【可存档】（丢了等于玩家的创作丢了）且【可见】（不可解释的饥饿就是噪音）"
    referenced_by: [reaction-solver, process-graph]

