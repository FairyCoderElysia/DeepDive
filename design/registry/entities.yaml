  # ---------- A2 引入的常量 ----------

  - name: STEP_TABLE_SCALE_T1
    value: "20–30 个化合物 / 40–60 条步骤"
    status: "暂定"
    note: "T1 垂直切片的表规模。依据：海水只有 8 元素、4 分类组；T1 只需覆盖海水->起步物资链 + 6 操作原语 + 两条失败通道（Cl 污染 / 结垢）。T3 完整愿景约 100–150 个化合物。"
    key_point: "丰富度来自【步骤的组合数】而非表的条目数 —— 一个 40 条的步骤表可支撑远超 40 条路径。"
    referenced_by: [compound-reaction-data, reaction-solver]

  - name: CONDITION_BAND_CONVENTION
    value: "[a, b) 左闭右开"
    note: "条件区间的取法约定（最优带 / 偏移带 / 越界三段均适用）。避免同一点同时属于两段。"
    companion_rule: "同一输入的各分支区间必须不重叠、不留缝 —— 否则出现'平局'或'无人区'（导入期校验）"
    referenced_by: [compound-reaction-data, reaction-solver, parameters-cost-surface]

