# 实体登记册（Entity Registry）—— 跨系统事实的权威来源
#
# 用途：任何"被两个以上系统引用的值或公式"都必须登记在这里，
#       以免同一个事实在多个 GDD 里各写一遍、然后漂移。
#       （本项目已实测过 6 次这类漂移事故，其中一次是"9 个依赖者"这个错数散在 4 个文件里。）
#
# 读取方式（供 /design-system §2a）：grep "referenced_by.*<系统名>"
#
# ⚠️ 铁律：本文件的【注释】不是数据。
#    CCGS 的登记册模板里，注释中带过一批"看起来像真值"的示例条目（键名形似真数据、值也是具体数字），
#    而那批示例曾被读取方误当成"已经锁定的值"。所以本文件的注释【刻意不写任何形似真条目的示例】——
#    连警示语里也只是描述这个陷阱，不把它复制进来。只认 entities / items / formulas / constants
#    四个活跃键下、且带 referenced_by 的条目。
#
# 创建：2026-10-02，由 A1（元素池与计量）的 §5b 首次建立。
#       当时文件与目录都不存在，故为 create（无 referenced_by 可合并）。

schema_version: 1        # 元素表 schema 必须版本化 —— 这是 A1 Core Rules ②（渐进元素集）的前提

# 本作【没有角色】：无敌人、无 NPC、无盟友。故 entities 恒为空。
entities: []

# items 会在 A2（化合物与反应数据表）与后续化学系统落地后开始登记。
items: []

formulas:

  - name: mass_fraction_to_atom_ratio
    description: 质量分数 → 原子数占比。**只在导入时发生**；内核只认原子数。
    expression: "原子数占比(e) = (质量分数(e) ÷ 原子量(e)) / Σ(质量分数(i) ÷ 原子量(i))"
    variables: [质量分数, 原子量]
    output: "原子数占比，0–1"
    verification: "海水实测 H:O = 2.0006（≈水的 2:1）；若直接用质量分数当原子数则 H:O = 0.126，造不出水"
    referenced_by: [element-pool]

  - name: remainder_accumulator
    description: 分数速率 → 整数搬运。**速率本身也必须是指数化整数**，否则会把浮点请回来（这正是 A1 决策 ① 要根除的）。
    expression: |
      r += rate_scaled          # rate_scaled 单位：原子 × SCALE / tick，本身即整数
      n = r / SCALE             # 整数除法，即 floor（只会少搬、绝不超搬）
      r -= n * SCALE
      搬运 n 个原子
    variables: [rate_scaled, r]
    output: "n 个整数原子；r ∈ [0, SCALE)"
    error_bound: "池相对理想连续模型的偏差 < 机器数 × 元素种数 个原子（有界，不漂移）"
    physical_reading: "累加器就是「反应器里还没反应完的那部分」—— 不是数值补丁"
    referenced_by: [element-pool, reaction-solver]

  - name: conservation_predicate
    description: 整数守恒判定。**判定走整数比较，无浮点容差。**
    expression: "T_end(e) == T_start(e) + 净导入(e)，对每个元素 e"
    variables: [T_start, T_end, 净导入]
    output: "bool"
    exclusion: "累加器里的小数部分（r 本身）**不计入**原子总量 —— 它还不是一个完整原子。此条不写明，实现者会算进去、然后每 tick 都假失败（T0 曾误报 32 次假不守恒，同一类错误）。"
    referenced_by: [element-pool, reaction-solver]

  - name: offset_to_branch_ratio
    description: 条件偏移 → 走向哪一支、各出多少（A2 的核心公式）。
    expression: |
      delta_k = 0                        若条件在最优带内
      delta_k = 距最近边界距离 / 偏移带宽   若在偏移带内  -> in (0, 1]
      （越界 -> 走灾难分支，不走此式）

      主产物占比   = max(0, 1 - sum(delta_k))
      副产物占比_k = delta_k * 该旋钮的副产物系数
    variables: [delta_k, 副产物系数]
    output: "主产物占比 与 各副产物占比_k（均为分数，和为 1）"
    conventions:
      - "区间一律 [a, b)（左闭右开），避免同一点属于两段"
      - "同一输入的各分支区间必须【不重叠、不留缝】-> 任一条件下恰有一条记录生效"
      - "因此多旋钮合并最终落在单条记录上，配平校验作用在该记录的输出集合"
    quantization: "整数量化【归 A3】，且必须走 A1 的余数累加器；A2 只存系数"
    determinism: "确定性函数，不掷骰子 —— 可复现（与 A1 对抢料的 (b) 口径一致）"
    referenced_by: [compound-reaction-data, reaction-solver, contaminants-failure-channels]

  - name: stoichiometry_balance_check
    description: 原子配平校验（A2 的导入期硬校验）。
    expression: "对每条步骤记录：Σ(输入侧各元素原子数) == Σ(输出侧各元素原子数)"
    variables: [输入侧原子数, 输出侧原子数]
    output: "bool（整数比较，无容差）"
    scope: "校验对象是【记录的输出集合】（主产物 + 各副产物），不是单个产物"
    on_failure: "拒绝导入整表 + 指出是哪一条（与 A1 的'拒绝整表'同一条纪律）"
    referenced_by: [compound-reaction-data]

  - name: limiting_reagent_progress
    description: 限制试剂与实际推进量（A2 明确把"限制试剂"交给 A3）。
    expression: |
      可推进份数 = min over 输入项 i ( 可用量_i / 需求量_i )
      推进       = 可推进份数   （分数；整数部分立即搬运，小数部分进累加器）
    variables: [可用量_i, 需求量_i]
    output: "推进份数（分数，由 A1 的余数累加器整数量化）"
    meaning: "比值最小的那一项决定推进 —— 这就是'谁先耗尽'"
    referenced_by: [reaction-solver, process-graph]

  - name: priority_tier_allocation
    description: 层内分配 —— 抢料的语义（A3 定义、A5 使用）。
    expression: |
      【层间】按优先级从高到低依次取料 —— 抢料只发生在层间
      【层内】按各机器的"当前实际需求_i"比例，把池中剩余可用量分给层内各机器
              然后 迭代到不动点（带上限）：
                算每机 min(分到量_i / 需求_i) -> 若推进量不再变化则稳定退出
                否则把"因其他输入受限而用不到的份额"释放回池、重新分配
    variables: [优先级, 当前实际需求_i]
    output: "每台机器本 tick 的推进量"
    why_iterate: |
      用"初始需求"分一趟会把用不到的料锁死。例：两台机器各要 2H+1O，池里只有 2H、100O ->
      H 是瓶颈、两台各只能推进 0.5 份，但按初始需求比例分会各分到 50 个 O（实际只需 0.5）->
      99 个 O 被锁住、饿死只要 O 的第三台机器。玩家会认为系统算错了，而它确实错了一半。
    conventions:
      - "同优先级 = 按需求比例等分（公平）；不同优先级 = 抢（玩家可配）—— 两层语义各司其职"
      - "等分必须【层内联立】，不能逐台分配 —— 逐台分配会让结果依赖处理顺序，违反确定性"
    determinism: "顺序由存档数据（优先级）决定，不需要随机种子 —— 比轮转+种子更强"
    referenced_by: [reaction-solver, process-graph]

  - name: contract_validation
    description: 契约校验判定式 —— 两侧对同一份数据的解释结果必须与期望值一致。
    expression: "对 schema 中每条字段声明 f：两侧解释结果(f) == 期望值(f)"
    variables: [schema 字段声明, 两侧解释结果, 期望值]
    output: "bool（且必须能指出【是哪一条】不符）"
    truth_source: "schema 文件本身（YAML）—— 不让任何一侧的实现成为规范，否则生成器里的一个 bug 就变成了规范"
    referenced_by: [schema-dual-interpreter]

  - name: migration_chain
    description: schema 版本迁移 —— 链式、显式、全成或全不成。
    expression: |
      vN -> vN+1  :=  [ 原语_1, 原语_2, ... ]      原语 in { add, remove, rename, transform }
      add(field, default)      : 默认值【取自 schema 文件】
      remove(field, where)     : 必须声明"信息去哪了"（丢弃 / 合并 / 先 transform）
      rename                   : 用 add + 迁值 + remove 表达，不引入新机制
      transform(field, fn)      : 必须带往返校验（有损变换不算通过）
      一次升一级、不跳级；任一步失败 -> 拒绝载入 + 指出哪一步；不得写回中间态
    variables: [schema_version, 字段级原语]
    output: "迁移后的数据（或拒绝）"
    danger: "remove 是最危险的原语 —— 若被删字段承载物质或状态，删掉就是丢信息（P2 边界，发生在时间维度上）"
    referenced_by: [schema-dual-interpreter]

  - name: continuous_flow_integration
    description: 连续流速率的积分 —— 累积量是积出来的，不是"按批累加"。
    expression: "累积量(t) = 累积量(t-1) + 速率 × dt"
    variables: [速率, dt, 累积量]
    applies_to: "结垢等一切累积量；清洗 = 一段停机时间（期间速率为 0），不是'算作一批'"
    forbidden: "不得写成按批累加 —— 那是 T0 原型的模型，概念文档明确禁止渗入任何系统 GDD"
    testable: "同一张图连续运行，结果必须随速率【连续变化】；若退化成按批结算，会出现台阶"
    referenced_by: [process-graph]

  - name: graph_evaluation
    description: 工艺图的求值 —— 外层环不动点 + 内层 A3 优先级层不动点（嵌套）。
    expression: |
      重复：
        沿环传播流量 -> 每个被访问的优先级层内部解一次 A3 的层内不动点
        若所有节点流量都不再变化 -> 稳定退出；否则继续
      达迭代上限仍未稳定 -> 采用当前值 + 告警（不得静默）
    variables: [图结构, 环, 优先级层]
    output: "每节点本 tick 的流量与状态"
    nesting_risk: |
      这是【嵌套】迭代：最坏工作量 ≈ 环迭代轮数 × 层数 × 层内迭代轮数。
      它不是两个独立的迭代 —— 已标为 B19 的第一号预算问题。
    boundary: "A5 只应用 A3 的语义，不重定义求值顺序"
    referenced_by: [process-graph]

  - name: cost_surface_aggregation
    description: 代价的聚合 —— 三项不是一个可加和的标量，而是一个权衡三角。
    expression: "代价(参数点 p) = { 能耗(p), 耗时(p), 纯度(p) }"
    variables: [参数点, 能耗, 耗时, 纯度]
    nature: |
      能耗 = 付出、耗时 = 付出、纯度 = 所得。
      所以它是【2 项付出 + 1 项所得】，不是三项同类清单。
    forbidden: "不得把三项加权成一个'总代价分数' —— 那会把权衡压平，玩家就看不到取舍了"
    source_of_items: "构成项（能耗/纯度/耗时）出自概念文档 P1 的设计测试原话，【不是 A6 新定的】"
    referenced_by: [parameters-cost-surface]

  - name: single_knob_slice
    description: 5 维代价面的默认降维方式 —— 单旋钮切片。
    expression: "切片(p, 旋钮 k) = { 代价(p 但把 k 从 lo 扫到 hi) }，其余 4 个旋钮固定为 p 的值"
    variables: [参数点, 旋钮 k]
    output: "一条曲线（代价随该旋钮变化）"
    why: |
      5 个旋钮的代价面是 5 维，无法直接呈现。
      默认必须是单旋钮切片，理由是操作性的：玩家一次调一个旋钮 ——
      界面要对齐的是"这一个旋钮往左/往右，代价怎么变"，而不是"整个空间长什么样"。
    not_provided: "全维视图（5 维无法呈现；强行降到 2 维会丢掉玩家正在调的那一维）"
    referenced_by: [parameters-cost-surface]

  - name: oxygen_balance
    description: 氧的收支 —— 本作唯一的记账式。
    expression: |
      净收支 = 产氧速率 - (工业耗氧 + 生命维持耗氧 + 存贮耗氧 + 销毁耗氧)
      存量  += 净收支 × dt          ← 速率积分（连续流，不是按批结算）
    variables: [产氧速率, 工业耗氧, 生命维持耗氧, 存贮耗氧, 销毁耗氧, 存量]
    output: "净收支（速率）与存量（两者都要：速率答'往里还是往外'，存量答'还能撑多久'）"
    unit: "氧"
    referenced_by: [oxygen-economy]

  - name: oxygen_priority_allocation
    description: 氧紧张时的三级分配（F-B4-1）—— 保证"紧绷但不会终结"。
    expression: |
      当 存量 < 阈值:  按【生命维持 > 产氧链本身 > 其他工业】分配
    variables: [存量, 阈值]
    why_three_tiers: |
      若"工业让位于生命维持"被直译成"工业全停"，会死锁：
      氧耗尽 -> 所有工业设备停摆 -> 【制氧设备也是工业设备】-> 它也停 -> 永远无法产氧 -> 不可恢复。
      而这违反全项目"所有状态可复原"的纪律（P5 无时限、不能有死档）。
      第二级"产氧链本身"的存在【就是为了避免死锁】。
    not_three_pools: "它是【同一数字上的分配顺序】，不是三个池 —— 拆池会拆掉支柱"
    same_mechanism: "与 A3 的优先级机制同构（层间抢料 + 层内联立），不需要新机制"
    referenced_by: [oxygen-economy]

  - name: tank_occupancy
    description: 罐容占用 —— 按【原子总数】计，且是跨化合物求和（这正是"允许混装"的数值含义）。
    expression: "占用(罐) = Σ_{罐内化合物 c} ( 数量(c) × 原子数(c) )  ；  剩余容量 = 罐容 - 占用"
    variables: [罐内化合物数量, 化合物组成, 罐容]
    note: "不引入新量纲（不要求 A2 给每个化合物补'分子体积'）"
    referenced_by: [tanks-capacity]

  - name: tank_draw_proportional
    description: 从罐中取出的规则 —— 按罐内组成比例取出（混合物流）。
    expression: |
      取出 k 个原子时：对罐内每种化合物 c，取出的数量(c) = k × ( 数量(c) / 占用(罐) )
      然后按 A1 的余数累加器整数量化（同 A3/A5 的纪律）
    variables: [k, 罐内组成, 占用]
    output: "一股混合物流（罐内只有一种化合物时自然退化为纯物质，无需特例）"
    why: |
      允许混装之后必然产生"取出来的是什么"这个问题。答案是不让玩家选（那是把问题推给玩家）、
      也不让罐子做提纯（它不是分离器）—— 而是直接变成下游要解决的问题：要分开就走 B3。
      这条让"存贮"与"分离"接上：混装不是省事，而是把今天的方便变成明天的工序。
    referenced_by: [tanks-capacity]

  - name: fouling_accumulation
    description: 结垢的累积 —— 连续积分，绝不是按批。
    expression: "积垢(t) = 积垢(t-1) + 速率(温度, 停留时间) × dt"
    variables: [温度, 停留时间, dt, 积垢]
    forbidden: "不得写成按批累加 —— 概念文档 Key Dynamics #8 的原措辞（'一批比一批低'）是批次语言，与 Core Mechanics #4 的警告冲突，以警告为准"
    max_behavior: "积垢到 100% -> 失效停产；清洗（一段停机时间）后恢复 —— 可复原"
    owner: "积垢跟着机器走；换机器能甩掉它，但换机器有实际代价（所以它是一个选择，不是退路）"
    referenced_by: [contaminants-failure-channels]

  - name: fouling_to_conversion
    description: 积垢 -> 转化率 -> 未反应物（由此与"回流"咬住）。
    expression: |
      转化率 = f(积垢)                    ← 随积垢下降
      未反应物 = 输入 × (1 - 转化率)        ← 这部分【必须被接住】（Key Dynamics #5）
    variables: [积垢, 输入]
    output: "转化率（随积垢下降）与未反应物"
    critical_reading: |
      概念文档原话是"糊住换热面 -> 转化率下降"，而"下降"有两读法：(a) 部分输入没被转化、
      (b) 转化变慢。取 (a) —— 因为它才会产生"未反应物"这条额外物流。
      由此【结垢与回流咬住】：结垢让未反应物变多 -> 玩家想回流 -> 而回流过量会稀释到不反应
      （Key Dynamics #2 循环死锁）-> "清洗"与"回流比例"成为同一个决策的两面。
    referenced_by: [contaminants-failure-channels]

  - name: purity_relative_to_target
    description: 纯度 —— 【相对于目标产物】的量，不是物流的固有属性。
    expression: "纯度(物流, 目标) = 目标产物的量 / 该物流的原子总数"
    variables: [物流, 目标产物, 原子总数]
    target_source: "目标由【产出它的那一步】声明（A2 的步骤记录里已有 outputs.主产物 字段）"
    why_not_intrinsic: |
      若靠"谁占比最大谁就是主"来算，纯度会随物流成分变化而反复改名，档位就没有意义了
      （同一份物流一会儿是"水 99.5%"、一会儿是"氧 60%"）。
      -> 纯度这个词必须带一个"相对于什么"。
    consequence: "没有声明主产物的物流没有档位（例如 B6 混装罐里按比例取出的那股）—— 它需要先被分离"
    referenced_by: [purity-grading]

  - name: purity_grade_mapping
    description: 纯度 -> 三档（边界与 A2 的 [a,b) 约定一致）。
    expression: |
      纯度 ∈ [99.9%, ∞)      -> 可用
      纯度 ∈ [99.0%, 99.9%)  -> 需精制（必须接一条分离产线）
      纯度 ∈ [0, 99.0%)      -> 不可用（分离也救不回来，只剩存贮/销毁）
    variables: [纯度]
    boundary_note: "99.9% 恰好达标算【可用】（概念文档说'规格是 99.9%'）；99.0% 恰好算【需精制】"
    thresholds: "全局统一（见 PURITY_THRESHOLDS）"
    referenced_by: [purity-grading]

  - name: separation_output_split
    description: 分离的产出分配与三方拉扯。
    expression: "输入 -> { 可用产物: 量 × 回收率,  废物流: 量 × (1 - 回收率) }"
    variables: [输入量, 回收率]
    triangle: "回收率 / 耗氧 / 废物流量 —— 三者互相拉扯；三个原语在三维上的【排序必须各不相同】"
    chaining: "允许串联（分离出的产物若仍不达标可再分离），但输入 < 99.0% 时无论串多少次都不可用"
    referenced_by: [purity-grading]

  - name: disaster_chain_propagation
    description: 灾难的连锁传播 —— 【沿图的边】，不沿空间。
    expression: |
      失控节点 --沿出边--> 下游节点（若未隔离）
      隔离生效 -> 该边断流，传播中止
    variables: [失控节点, 出边, 隔离状态]
    why_along_edges: |
      概念文档说"爆罐"，那个词听起来很空间，但本作【没有空间模型】
      （Core Mechanics #4：管网是节点+边的逻辑图，不是逐 tile 模拟）。
      机器之间只有"连没连"，没有"旁边" -> 连锁只能沿边。
      这恰好让"保险三件套"全部说得通：隔离 = 在边上断流、旁通 = 绕开受损节点/边、
      泄压 = 设备自身属性 —— 三者都是【图/设备】层面的事，一个都不需要空间。
    presentation_split: |
      表现上【可以】做得像"炸到了旁边"（那正是"壮观"要的），但机制上必须是
      "失控的物料沿边流到了下游" —— 否则实现者会去找一个不存在的空间模型。
    referenced_by: [disasters-runaway]

  - name: disaster_repair_cost
    description: 灾难的修复成本 —— 连续旋钮，且受玩家投资影响。
    expression: "修复成本 = f(严重度) ;  并且上了保险的产线赔偿上限更低"
    variables: [严重度, 保险配置]
    continuous: "是一个连续旋钮，不是'活/死'开关（设备仍存在、需修）"
    knob_note: "这是概念文档风险 #5 那个刻度：太便宜则灾难失去重量、太贵则劝退 —— 需实测"
    player_choice: |
      保险是玩家造的（不是自动的）+ 修复成本随严重度 ->
      "我的产线该不该上保险"成为一个真正的风险/收益决策。
      这比"改一个全局系数"好得多：它让同一个数值下谨慎的玩家与鲁莽的玩家承受不同后果，
      而"承担自己选择的后果"正是 P2 与 P3 的交汇点。
    referenced_by: [disasters-runaway]

  - name: connection_is_a_decision
    description: 一种连线决策成立的判据 —— 它必须能产生不同的结果。
    expression: "一种连线决策成立  <=>  同一个场景下，不同的接法会产生【不同的结果】"
    variables: [接法, 结果]
    use: "这是 B1 验收第 1 条的依据 —— 若两种接法结果相同，那它就不是决策"
    referenced_by: [connection-decisions]

