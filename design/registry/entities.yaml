    referenced_by: [tanks-capacity]

  - name: TANK_IS_POOL_SUBSET
    value: true
    note: "罐子 = 池的一个【有界子集】，不是池之外的地方。"
    why_critical: |
      A1 的守恒判定式是 T_end = 池 + 在途 + 机器内已整数量，它没有"罐内存量"这一项。
      若罐子被实现成"池之外的地方"，两个方向都会误报：存进去 -> 池少了而 T_end 无对应项 ->
      判定不守恒；取出来 -> 反之。而 A1 的规则 ⑤ 是"对账失败 -> 拒绝该动作 + 锁" ->
      【整个工厂会在玩家第一次存料时锁死】。这比"算错"严重得多。
    consequence: "存入/取出只是池内部的移动 -> 守恒自动成立；不需要改 A1 的公式"
    referenced_by: [tanks-capacity, element-pool]

  # ---------- B2 引入的常量 ----------

  - name: TWO_FAILURE_CHANNELS
    value: "氯通道 = 组成问题；结垢通道 = 设备状态"
    note: "两条通道【互补】的机制原因正是「表示方式不同」。"
    why_complementary: |
      一个攻击你的物质（物流里混进了别的东西，看得见、立刻发作、靠分离/存贮/销毁解决），
      一个攻击你的设备（换热面上的积垢量，看不见物流、持续发作、靠清洗解决）。
      它们攻击的是两样不同的东西，所以不可能被同一个办法解决。
    easiest_mistake: |
      把两者都实现成"一个污染值"（例如每台机器一个 0-100 的"脏度"）。
      那会同时废掉两条通道的性格差异，而且会悄悄把"设备会老化"变成可以靠看物流发现的东西 ——
      而它本来不该被发现（那正是"慢性"的来源）。
    referenced_by: [contaminants-failure-channels]

