    unit: "g/mol"
    element_of: chem_elements
    referenced_by: [element-pool]

  - name: atomic_mass_Mg
    value: 24.305
    unit: "g/mol"
    element_of: chem_elements
    referenced_by: [element-pool]

  - name: atomic_mass_S
    value: 32.06
    unit: "g/mol"
