  - name: SIX_KINDS_OF_STOPPED
    value: |
      A3 对账锁        -> 确认 + 重算基线
      B2 结垢失效      -> 清洗（一段停机时间）
      A5 阻塞          -> 腾出容量
      B5 灾难          -> 修（成本随严重度）
      C1 管路超限破裂  -> 换管 / 降压
      A5 干涸          -> 接回上游
    note: "六种停的【修法互不通用】—— 所以'我的机器停了'这一句话必须被拆成六句。"
    grouping: "按【修法】分组（在这里与按原因分组恰好一对一的，但标签是玩家要的那个答案）"
    referenced_by: [diagnosis-feedback]

  - name: DIAGNOSIS_PUSH_GRADING
    value: "严重（灾难/失效/对账锁）-> 主动提示；轻微（效率下降/接近上限）-> 可查"
    standard: "分界线 = '玩家现在必须做什么'：必须立刻做 -> 推送；可以等一下 -> 可查"
    why: |
      本作是连续流、世界不停（无时限、不暂停）-> 主动推送不能打断玩家；
      而 B5 要求灾难"壮观"+"可诊断"-> 必须被立即注意到。分级是唯一同时满足两者的答案。
    referenced_by: [diagnosis-feedback]

  - name: DIAGNOSIS_TIMESTAMP_IS_GAME_TIME
    value: "归因的时间戳必须用【游戏内时间】，不能用现实时间"
    why: |
      B19 已定"超预算 -> 世界走慢"（tick 变长）。若用现实时间，
      同一段因果在走慢时会显示成"持续了很久"，而实际游戏内只过了几秒 ->
      那会让诊断在玩家最需要它的时候（工厂很大、世界很慢）恰好失真。
    referenced_by: [diagnosis-feedback, performance-budget]

  - name: NO_POST_HOC_RECONSTRUCTION
    value: "归因必须【实时记录】，不得事后重建"
    note: "这是三条上游契约（A3/B2/B5）的同一句话：若上游不记录归因，诊断就无从下手。"
    consequence: "B10 不产生归因，它只【消费】归因 —— 所以它的正确性取决于三处上游是否按同一形状记录"
    referenced_by: [diagnosis-feedback]

  # ---------- B11 引入的常量 ----------

  - name: HUD_AMBIENT_QUOTA
    value: "常驻 = 氧气 + 当前诊断（两个信号色正好用满）；其余按需展开"
    why_arithmetic: |
      这不是设计偏好，而是【颜色预算的算术结果】：
      art-bible §1（饱和度只给氧气和危险 -> 信号色总量 4 个语义）·
      §4（同一画面最多两个信号色）· §4（氧青绝不用于危险 -> 氧气固定占一个）
      -> 常驻内容只剩【一个】信号色的额度 = 当前诊断。
      这正是 art-bible"形状必须承担主要的信息负载"的由来：信号色不够用，所以形状必须扛。
    referenced_by: [hud-ui]

  - name: HEATMAP_IS_THE_BASE_LAYER
    value: "热力图是背景主图层，HUD 叠在其上（两层）"
    color_division: |
      热力图（主图层）用【底色与渐变】（art-bible 的 3 个底色）；
      HUD（叠层）用 4 个信号色（同画面最多 2 个）。
      判据：信号色的语义是"你现在必须做什么"；而热力图给的是"环境是什么样的"（状态而非指令）。
    why_critical: |
      若不划清，热力图（温度/压强/氧/纯度）会把信号色额度吃光，
      同一画面就会超过两个 -> 而 art-bible §4 说"出现三个及以上时，信号就不再是信号了"。
    source: "概念文档 line 360（热力图是主图层，不是调试工具）+ art-bible §4"
    referenced_by: [hud-ui]

  - name: DUAL_CHANNEL_READING
    value: "读数 = 数字 + 形状【双通道】"
    division_of_labor: "数字给【精确值】（离下一档还差 0.05%）· 形状给【状态与趋势】（在往哪边走、离边界多远）"
    why_inevitable: |
      B3 的契约说"不得假设'差一点'等于'差不多'"（99.85% 与 99.95% 在这里一个可用一个不可用）
      -> 需要精确值（纯图形会丢）；
      art-bible §3④ 说形状必须承担主要信息负载 -> 需要形状。
      两条合起来 = 双通道。
    referenced_by: [hud-ui]

  - name: CONSUMER_NOT_RECOMPUTER
    value: "B11 是【消费者】，不是【重算者】—— 它显示的每一个数都必须来自上游"
    four_contracts: |
      B10：不得假设自己能推原因 · B3：不得假设档位可事后补算 ·
      B4：不得假设"产出"总是正贡献 · A6：不得假设有全维视图、不得假设可事后重建。
    consequence: |
      这四句是同一句。若 B11 开始自己算（哪怕"顺手算一下"），
      本项目那 6 次"同一事实两处定义然后漂移"的事故就会有第 7 次。
    referenced_by: [hud-ui]

  - name: UI_CARRIES_DECISIONS_ONLY
    value: "界面只承担【决策】；事实全部收进百科（B7）"
    source: "L4（2026-10-02）：'降认知负荷靠把事实放对位置，不靠删严谨性'"
    consequence: "所以 B11 是'决策界面'，不是'事实界面'"
    referenced_by: [hud-ui]

  # ---------- B12 引入的常量 ----------

  - name: HEATMAP_SUBSTRATES
    value: "深度轴（连续场）+ 图上的节点与边（离散点）—— 两个基板"
    key_point: "两个基板都不是新造的 —— 它们分别来自 C1 的一维连续轴与 A5 的读数（art-bible 的资产里也有'分层背景'）"
    referenced_by: [heatmap-base-layer]

  - name: ONE_HEATMAP_LAYER_AT_A_TIME
    value: "一次一个子图层，可快速切换（不叠加）"
    two_reasons: "① 语义不同（温度的高与氧的高不是同一件事）· ② 可分辨度是有限预算（同 art-bible §1 的逻辑）"
    note: "氧已经在 HUD 常驻（B11 的③），所以热力图不必为它留位"
    referenced_by: [heatmap-base-layer]

  - name: DEFAULT_HEATMAP_LAYER
    value: "温度"
    why: "L1/B8 定了'开局给的旋钮是温度 T + 催化剂' -> 开局的热力图应该是温度（它对应玩家此刻唯一能用上的旋钮）"
    referenced_by: [heatmap-base-layer, progressive-unlock]

  - name: HEATMAP_IS_NOT_A_DEBUG_TOOL
    value: "它是主图层、默认可用 —— 不是可选 debug overlay"
    source: "概念文档 line 360（争'可选 debug overlay' vs '常规视图' -> 选常规视图）"
    referenced_by: [heatmap-base-layer]
