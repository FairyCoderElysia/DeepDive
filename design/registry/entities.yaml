    feel_difference: "前者是【你在管理】，后者是【你在被追】—— 这个区别是手感上的"
    referenced_by: [contaminants-failure-channels]

  # ---------- B3 引入的常量 ----------

  - name: PURITY_THRESHOLDS
    value: { 可用: ">= 99.9%", 需精制: "99.0–99.9%", 不可用: "< 99.0%" }
    note: "【全局统一】—— 三种阈值对所有产物一样。用户早先拍过（概念文档 line 93）。"
    why_global: |
      它与 B4 的一条硬约束一致：氧的双角色共用【同一个数字】。
      若规格逐产物不同，就等于说"生命维持用的氧"与"工业用的氧"是两个标准 ——
      而那正是 B4 明令禁止的"拆成两个池"的变体（不是拆池，而是拆规格）。
      -> 全局统一不只是"简单"，它是那条约束的必然推论。
    referenced_by: [purity-grading]

  - name: NO_RESCUE_FLOOR
    value: "输入纯度 < 99.0% -> 不可救（分离也救不回来，含稀释）"
    note: "概念文档明写'<99.0% 太脏，分离也救不回来，只能存贮或销毁'。"
    vs_chaining: |
      它与"允许串联"不矛盾：地板是对【输入】说的（低于它，怎么分、分多少次都没用），
      串联针对的是【地板之上】的物流（99.5% 可以靠串联两次做到 99.95%）。
      -> 地板是绝对的，而地板上方是可以用工序堆出来的。
      【若这条不写清，实现者会走两个方向之一、而两个都错】——
      把地板读没（"只要串就总能救"）或把产线读成开关（"一次分离定生死"）。
    referenced_by: [purity-grading]

  - name: SEPARATION_PRIMITIVES_T1
    value: [冷凝, 碱洗吸收, 吸附]
    note: "T1 的三个分离原语（用户拍板）。概念文档给了碱洗与吸附的对比：碱洗回收率最高但产生含氯废液；吸附最费氧但污染残留最少。"
    requirement: "三者在'回收率 / 耗氧 / 废物流量'上的【排序必须各不相同】，否则'分离路线本身是设计题'不成立"
    open: "冷凝的位置待定 —— 它必须与另两者排序不同"
    referenced_by: [purity-grading]

  # ---------- B5 引入的常量 ----------

  - name: ENGINEERING_INSURANCE
    value: [隔离, 泄压, 旁通]
    note: "概念文档要求'提供隔离、泄压、旁通这类工程上的保险给玩家用'。"
    owners: "【玩家造的】，不是自动生效的 —— 概念文档'提供…给玩家用'这句原话暗示了这一点"
    what_each_does: "隔离 = 在边上断流（别让它传过去）· 泄压 = 别让它炸 · 旁通 = 绕开受损节点/边"
    why_chaining_exists: |
      【保险的存在本身就意味着有一个需要被保的东西】—— 而那东西就是连锁。
      若灾难不连锁，这三样都没有对象，会变成三个没有用处的装饰件。
      -> "会连锁"不是我们另加的设计，而是那句"提供工程保险"的必要前提。
    referenced_by: [disasters-runaway]

  - name: DISASTER_IS_NOT_RANDOM
    value: "同存档 + 同操作序列 -> 灾难必然复现（无随机性）"
    note: "P2 的底线：'严谨是美感'的全部卖点就是【不是运气】。"
    consequence: "灾难像随机事件砸下来，就把它变成了运气 —— 而那不是本作要的东西"
    referenced_by: [disasters-runaway]

  - name: FOUR_KINDS_OF_STOPPED
    value: "A3 对账锁 / B2 结垢失效 / A5 阻塞 / B5 灾难"
    note: "四种「机器停下来了「的原因与恢复手段【完全不同】：确认基线 / 清洗 / 腾容量 / 修"
    why_it_matters: |
      界面上必须可区分 —— 否则玩家看到"我的机器停了"却不知道该怎么办，
      而四种停法的修法互不通用。
    referenced_by: [disasters-runaway]

  # ---------- B1 引入的常量 ----------

  - name: NO_ILLEGAL_CHEMISTRY
    value: "不用'非法'去阻止化学错误 —— 只保证端口存在、能接"
    note: "混料 / 接回上游 / 回流过量 / 自环【全部允许】—— 它们是教学内容，不是要拦住的东西。"
    why: |
      概念文档的失败模式表里，那些"错接"全部写的是【后果】与【玩家学到什么】，而不是"被禁止"。
      禁掉它们等于禁掉教学内容。-> 真正的负担当不在"拦截"，而在"可诊断"。
    consequence: |
      本作的"合法性判定"几乎是空的（唯一的结构限制是"端口不存在"；
      而"类型接不上"在本作也极小，因为所有物流都是化合物）。
      【已据此回补 A5：它那句"合法性判定"措辞过宽，已改成"端口存在性"。】
    referenced_by: [connection-decisions]

  - name: T1_CONNECTION_DECISIONS
    value: [纯化支线接在哪一级, 出口选路, 回流]
    note: "T1 做的三种连线决策（④ 分流比例属 T3）。"
    disambiguation: |
      ② 出口选路与 ④ 分流比例【不是同一件事】：
      ② 是"一台机器有多个出口、每个各接一处"（T1）；
      ④ 是"一个出口的产出分给多个下游"（T3）。
    f1_target: "F1 要验证的正是这三种在【多级、可自由布线】时是否仍然好玩 —— 那是 T1 的头号目标"
    referenced_by: [connection-decisions]

  - name: PREVIEW_RESULT_NOT_CONCLUSION
    value: "连线时可以预告【结果】，但不替玩家解释【原因】、也不给结论"
    note: "例如显示'氯氧化比 -> 48.8%'，但不弹'建议不要接'。"
    why: |
      T0 v4 那个"啊我不该那样接"来自玩家的【心智模型错了】（他以为循环利用是对的），
      不是来自信息缺失。玩家看到数字仍会连上去、然后才发现自己理解错了 -> 这才是教学；
      而弹"建议不要接"会让决策被游戏替玩家做了。
    same_as: "与 P1 的设计测试同源（'百科给一条可行解，并让玩家看见它代价'）"
    referenced_by: [connection-decisions]

  - name: NO_EDIT_MODE
    value: "没有编辑态 / 运行态切换 —— 玩家在【运行中】改线"
    note: "从连续流推出（无时限、不暂停）。"
    consequence: |
      B1 是"在一个一直在动的系统上做编辑"，它的手感问题（吸附、撤销、误触）比静态编辑器更尖锐 ——
      因为世界不会为你停下来。
    safety: "改线是安全的（A5 的澄清 3：边不持有物质、只承载速率）-> 删线不会泄漏物料"
    referenced_by: [connection-decisions]

  # ---------- B7 引入的常量（B7 没有自己的公式 —— 见 ENCYCLOPEDIA_HAS_NO_FORMULAS）----------

  - name: ENCYCLOPEDIA_ROLE
    value: "入门坡道，不是答案本"
    gives: [一条可行解（不是最优解）, 每一步的条件, 让零基础玩家把第一条线跑起来]
    does_not_give: [最优解, 任何豁免（条件不对照样出意外产物、照样炸）, 后续产物的完整路线图]
    source: "用户原话 + 概念文档《百科的定位》整节（line 321-337）"
    why: |
      ① 它是 P3 的前提（玩家得先有一条能跑通的线才谈得上优化）；
      ② 它把"卡住"变成"想优化"（挑战从"我完全不知道怎么办"移到"这条解不够好"）；
      ③ 它与 P2 不冲突（给的是路线，不是豁免）。
    twin_criteria: "『非最优测试』与『无豁免测试』必须同时成立 —— 只满足前者会变成作弊本，只满足后者则什么都没给"
    referenced_by: [encyclopedia]

  - name: THREE_DISCOVERY_PATHS
    value: { 参数漂移: 实验 -> 通用规律, 百科残页: 探索 -> 具体路线, 异常点探测: 观察 -> 线索 }
    note: "概念文档把这三条【并列】（line 49：教程只教 6 个操作，其余靠这三条发现）。"
    key_insight: |
      既然并列，它们通向的就是【三批不同的知识】，而不是同一批知识的三把钥匙。
      -> 推论：残页不是"靠实验获得的条目"，而是"你走到那里才知道的知识"。
         若把残页做成实验奖励，它就与"参数漂移"重合了 —— 三条途径会塌成一条。
    referenced_by: [encyclopedia]

  - name: FACTS_VS_CRAFT
    value: "事实进百科（B7）、工艺进 B9"
    note: "玩家实验发现的【化学规律】记进百科；玩家连出来的【工艺方案】进 B9 工艺卡。"
    why: |
      两者都"属于玩家"，但归属不同：一个进【知识库】，一个进【作品集】。
      价值：让"发现"循环闭合 —— 玩家自己搞明白的事实会被记下来（下次不用靠记忆），
      而【他发明的东西仍然是他的作品】（P3 完整）。
    referenced_by: [encyclopedia]

  - name: KNOWLEDGE_UNLOCK_VS_MECHANISM_UNLOCK
    value: "B7 管『你知道吗』；B8 管『你能用吗』"
    note: "两者【可以不同步】，而且应该允许不同步。"
    example: "你可能已经知道一条含氯路线（B7 残页到手），但还没解锁处理它的分离原语（B8 未给）"
    danger: |
      若把两者合成一个（例如"解锁残页就自动解锁机制"），"知道"就会自动等于"能用"——
      那会抹掉 B8 的整个渐进设计，也会让"读到一条路线但暂时做不到"这个很真实的体验消失。
    referenced_by: [encyclopedia]

  - name: ENCYCLOPEDIA_HAS_NO_FORMULAS
    value: "B7 不得自己计算 —— 每个数值都必须能追溯到上游"
    mapping: "路线条件来自 A3+A2 / 代价来自 A6 / 档位与分离对比来自 B3"
    consequence: "若百科里出现一个追溯不到上游的数，那就是一处越界"
    failure_mode: "它不会算错（因为不算），它只会『说错』—— 而那是误导，比算错更难发现"
    referenced_by: [encyclopedia]
