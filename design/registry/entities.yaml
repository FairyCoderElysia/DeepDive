  - name: atomic_mass_K
    value: 39.098
    unit: "g/mol"
    element_of: chem_elements
    referenced_by: [element-pool]

  # ---------- 5 个工艺旋钮（全项目共享；权威定义在 element-pool §Tuning Knobs A）----------

  - name: param_temperature
    value: { min: 20, max: 200, default: 80 }
    unit: "°C"
    note: "温度 T。范围来自 T0 实测（每个旋钮都已验过存在内部最优，非单调）。默认值【暂从 T0 继承】，正式值应在 T1 按手感重调。"
    referenced_by: [element-pool, compound-reaction-data, reaction-solver]

  - name: param_pressure
    value: { min: 1, max: 40, default: 6 }
    unit: "atm"
    note: "压强 P。⚠️ 注意与「深度带来的压强」区分：那属 C1（T3），本旋钮是反应器的一个工艺参数（MVP 即有）。"
    referenced_by: [element-pool, compound-reaction-data, reaction-solver]

  - name: param_residence_time
    value: { min: 0.5, max: 15, default: 4.0 }
    unit: "相对"
    note: "停留时间 τ。"
    referenced_by: [element-pool, compound-reaction-data, reaction-solver]

  - name: param_catalyst
    value: { options: [无催化剂, 镍网, 铂片], default: 铂片 }
    unit: "枚举 3"
    note: "催化剂。"
    referenced_by: [element-pool, compound-reaction-data, reaction-solver]

  - name: param_anode_material
    value: { options: [石墨阳极, 钌铱涂层钛_析氯型, 铱钽涂层钛_析氧型], default: 铱钽涂层钛_析氧型 }
    unit: "枚举 3"
    note: "阳极材料。**它存在的唯一理由是氯污染通道** —— 若砍掉 Cl 通道，本旋钮会变成死重、参数表必须退回 4 个。"
    referenced_by: [element-pool, compound-reaction-data, reaction-solver]

  # ---------- A2 引入的常量 ----------

  - name: STEP_TABLE_SCALE_T1
    value: "20–30 个化合物 / 40–60 条步骤"
    status: "暂定"
    note: "T1 垂直切片的表规模。依据：海水只有 8 元素、4 分类组；T1 只需覆盖海水->起步物资链 + 6 操作原语 + 两条失败通道（Cl 污染 / 结垢）。T3 完整愿景约 100–150 个化合物。"
    key_point: "丰富度来自【步骤的组合数】而非表的条目数 —— 一个 40 条的步骤表可支撑远超 40 条路径。"
    referenced_by: [compound-reaction-data, reaction-solver]

  - name: CONDITION_BAND_CONVENTION
    value: "[a, b) 左闭右开"
    note: "条件区间的取法约定（最优带 / 偏移带 / 越界三段均适用）。避免同一点同时属于两段。"
    companion_rule: "同一输入的各分支区间必须不重叠、不留缝 —— 否则出现'平局'或'无人区'（导入期校验）"
    referenced_by: [compound-reaction-data, reaction-solver]

  # ---------- A3 引入的常量 ----------

  - name: SOLVER_FIXPOINT_ITERATION_CAP
    value: 8
    unit: "轮"
    status: "暂定"
    note: "层内分配的不动点迭代上限。达到上限仍未稳定 -> 采用当前结果 + 告警（不得静默）。"
    tradeoff: "稳定性 vs 性能"
    referenced_by: [reaction-solver]

  - name: CONTENTION_CONVENTION
    value: "层间抢（玩家可配优先级）；层内按需求比例等分"
    note: "多台机器争同一池料的语义约定。A3 定义、A5 使用（A5 的图求值语义来自 A3）。"
    requirement: "优先级必须【可存档】（丢了等于玩家的创作丢了）且【可见】（不可解释的饥饿就是噪音）"
    referenced_by: [reaction-solver]

  # ---------- A4 引入的常量 ----------

  - name: MIGRATION_PRIMITIVES
    value: [add, remove, rename, transform]
    note: "迁移只允许用这四个原语，不引入别的。rename 由 add+迁值+remove 表达。"
    referenced_by: [schema-dual-interpreter]

  - name: VALIDATION_TRIGGER
    value: "数据改动后 + 提交前"
    note: "完整校验的触发时机（离线/开发期）。运行时只做轻量版本检查（版本不匹配则拒绝载入）。"
    rationale: "完整校验的价值在于在开发者手上拦住错误，不在于在玩家机器上 —— 放运行时等于把开发期问题的代价推给玩家"
    referenced_by: [schema-dual-interpreter]
