# CCGS project configuration — single source of truth for project settings.
# Schema: grep the `## <key>` section of .claude/docs/effects-map.md —
# it is ~31k tokens whole, ~900 per section. Do not open it entire.

schema_version: 1

framework:
  version: 1.1.2
  last_upgraded: 2026-10-02

project:
  stage: systems-design
# modes.rigor fronts six knobs (modes.workflow, docs.density, qa.level,
# modes.story_granularity, modes.review_mode, team.size). Do NOT write those six
# here — an explicit value pins it and shadows the rigor expansion. Project-wide
# exceptions go in the top-level workflow_overrides block (本项目尚未需要);
# per-system ones in workflow_overrides.system_overrides.
modes:
  rigor: standard
  automation: guided

# ---------------------------------------------------------------------------
# Written by /setup-engine (2026-10-02). These four blocks are what §5.5.1
# owns; they are dual-written to .claude/docs/technical-preferences.md, which
# is a legacy mirror. Where both files carry a key, project.yaml wins.
# ---------------------------------------------------------------------------

engine:
  name: "Godot"
  version: "4.7.2"          # = 官方最新 stable，且与本机安装版一致
  language: "GDScript"
  rendering: "Forward+"     # §5.5.1 shape 表：2D · 非 web 行
  physics: "Godot Physics 2D"   # 同上。NOT Jolt —— Jolt 是 Godot 的 3D 默认引擎

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

commands:
  build: "godot --headless --path . --editor --quit"   # 2026-10-03（/test-setup）：先用"构建校验"。
                                # 它跑一遍完整导入 + 全项目脚本/资源扫描 —— 脚本写错、类名冲突、
                                # 资源丢失都会在这里 exit != 0，所以它真的能挡住"构建坏了"。
                                # ⚠️ 真正的 export 仍需 export_presets.cfg 与【preset 名】，
                                # 而 §5.5.1 明令 ASK（猜错会"运行成功但构建错平台"）。
                                # 本作是 PC 单机，将来大概率是 Windows Desktop —— 但到时候再问你。
  test: "godot --headless -s -d --remote-debug tcp://127.0.0.1:0 res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode"
  run: "godot --path . --windowed --resolution 1280x720"
  smoke: "godot --headless --editor --quit"   # 2026-10-02 实测改的：原来的 "--quit-after 5"
                                # 会因缺少 run/main_scene 直接报错并 exit=1（不是"挂着不退出"，
                                # 那条旧记录是错的）。headless 编辑器导入后退出 = exit 0 / 约 6 秒，
                                # 不需要 main scene，且真的跑了一遍资源导入与脚本类扫描。
